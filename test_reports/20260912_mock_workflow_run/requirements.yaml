- id: VPAT-11267
  title: ZZ REG State Diagram SeatSwitch
  type: componentrequirement
  outlineNumber: 2.1-7
  status: draft
  description: 'Die Zustandsmaschine der Funktion ist das flache TargetLink-Chart
    <code>TL_SeatSwitch/SeatSwitch</code> (Zeile 56 der Quelle). Von aussen betrachtet:
    <b>3 Zustaende</b>, <b>5 Uebergaenge</b> zuzueglich des Initialuebergangs, <b>0
    Untermaschinen</b>. Startzustand ist <b>SeatSwitchOff</b>; er wird vom Default-Zweig
    gesetzt, nicht von einem Uebergangsknoten.<br/><img alt="SysML-Zustandsdiagramm
    der Funktion SeatSwitch" src="workitemimg:1-statechart_TL_SeatSwitch_SeatSwitch.png"
    style="max-width: 650px;" title="statechart_TL_SeatSwitch_SeatSwitch.png"/><table
    class="polarion-Document-table" style="width:100%;max-width:1280px;margin-left:0px;margin-right:auto;border:1px
    solid #CCCCCC;empty-cells:show;border-collapse:collapse;"><tbody><tr><th style="font-weight:bold;background-color:#F0F0F0;text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">Zustand</th><th style="font-weight:bold;background-color:#F0F0F0;text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">Zeilen im Code</th></tr><tr><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;"><code>SeatSwitchOff</code></td><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">153–189</td></tr><tr><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;"><code>SeatSwitchRelease</code></td><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">191–255</td></tr><tr><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;"><code>SeatSwitchOn</code></td><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">257–306</td></tr></tbody></table><table class="polarion-Document-table"
    style="width:100%;max-width:1280px;margin-left:0px;margin-right:auto;border:1px
    solid #CCCCCC;empty-cells:show;border-collapse:collapse;"><tbody><tr><th style="font-weight:bold;background-color:#F0F0F0;text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">Von</th><th style="font-weight:bold;background-color:#F0F0F0;text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">Nach</th><th style="font-weight:bold;background-color:#F0F0F0;text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">Waechter</th></tr><tr><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;"><code>SeatSwitchOff</code></td><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;"><code>SeatSwitchOn</code></td><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;"><code>TSigStateSeatContact_u16 == 0 && DISeatContact_u8
    == 1</code></td></tr><tr><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;"><code>SeatSwitchOn</code></td><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;"><code>SeatSwitchRelease</code></td><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;"><code>DISeatContact_u8 == 0</code></td></tr><tr><td
    style="text-align:left;vertical-align:top;border:1px solid #CCCCCC;padding:5px;"><code>SeatSwitchOn</code></td><td
    style="text-align:left;vertical-align:top;border:1px solid #CCCCCC;padding:5px;"><code>SeatSwitchOff</code></td><td
    style="text-align:left;vertical-align:top;border:1px solid #CCCCCC;padding:5px;"><code>DISeatContact_u8
    != 0 && TSigStateSeatContact_u16 != 0</code></td></tr><tr><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;"><code>SeatSwitchRelease</code></td><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;"><code>SeatSwitchOn</code></td><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;"><code>TSigStateSeatContact_u16 == 0 && DISeatContact_u8
    == 1</code></td></tr><tr><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;"><code>SeatSwitchRelease</code></td><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;"><code>SeatSwitchOff</code></td><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;"><code>(TSigStateSeatContact_u16 == 0 && DISeatContact_u8
    == 0 && Cn1_counter == 0) || TSigStateSeatContact_u16 != 0</code></td></tr></tbody></table><b>Notation:</b>
    abgerundete Kaesten sind Zustaende, Pfeile Uebergaenge. Die Beschriftung eines
    Pfeils ist der <i>Waechter</i> in eckigen Klammern, danach die Aktionen. Der ausgefuellte
    Kreis markiert den Startzustand. Ein Kompartiment im Zustandskasten (entry/do/exit)
    bleibt leer, wo das Verhalten im Modell nicht geführt ist.<br/><b>Zwei Waechter-Korrekturen
    der SE-Durchsicht vom 2026-08-18</b> bleiben in Kraft: Release→Off prueft code-wahr
    <code>Cn1_counter == 0</code> statt <code>SeatswitchTimeVal_u16 == 0</code>, und
    On→Off ist die Konjunktion aus Sitzkontakt UND Signalfehler — das Loslassen hat
    Vorrang. Die Extraktionskette bleibt auf Operator-Entscheid unveraendert.'
