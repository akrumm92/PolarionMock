  title: ZZ REG NEW Betriebsarten des Systems - Seatswitch
  type: systemrequirement
  outlineNumber: 14.3-1
  status: draft
  description: '<p><p>Das System kennt <b>drei Betriebsarten</b>, die den drei Zustaenden
    der Zustandsmaschine entsprechen: <b>SeatSwitchOff</b> (Sitz nicht besetzt oder
    Fehler erkannt), <b>SeatSwitchOn</b> (Fahrer sitzt, Signaltest in Ordnung) und
    <b>SeatSwitchRelease</b> (Sitzkontakt geoeffnet, Loslass-Zeit laeuft).</p><p>Nach
    dem Start befindet sich das System in <b>SeatSwitchOff</b>. Ein Wechsel zwischen
    den Betriebsarten findet ausschliesslich ueber die in Kapitel 5.1 beschriebenen
    Uebergaenge statt; eine andere Ursache fuer einen Wechsel gibt es nicht.</p><table
    class="polarion-Document-table" style="width:100%;max-width:1280px;margin-left:0px;margin-right:auto;border:1px
    solid #CCCCCC;empty-cells:show;border-collapse:collapse;"><tbody><tr><th style="font-weight:bold;background-color:#F0F0F0;text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">Betriebsart</th><th style="font-weight:bold;background-color:#F0F0F0;text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">Startzustand</th><th style="font-weight:bold;background-color:#F0F0F0;text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">Zeilen im Code</th></tr><tr><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;"><code>SeatSwitchOff</code></td><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">ja</td><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">153&ndash;189</td></tr><tr><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;"><code>SeatSwitchRelease</code></td><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">nein</td><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">191&ndash;255</td></tr><tr><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;"><code>SeatSwitchOn</code></td><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">nein</td><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">257&ndash;306</td></tr><tr><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">Initialisierung (Default-Zweig)</td><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">&mdash;</td><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">307&ndash;310</td></tr></tbody></table></p>'
- id: VPAT-11289
  title: 'ZZ REG NEW Fehlererkennung: Sitzkontaktschalter-Fehler'
  type: systemrequirement
  outlineNumber: 14.3-2
  status: draft
  description: '<p><p>Das System erkennt <b>zwei</b> Fehlerbilder des Sitzkontaktschalters
    und meldet sie als Diagnosecode: einen elektrischen Fehler des Sitzkontakt-Kreises
    und einen Plausibilitaetsfehler, wenn der Sitzkontakt ueber 20 Betriebsstunden
    hinweg kein einziges Mal wechselt. Beide Codes gehen auf CAN und in den Fehlerspeicher.</p><p>Die
    vollstaendige Definition beider Codes samt Ausloesebedingung, Entprellung und
    Ruecknahme steht in Kapitel 5.8.</p><table class="polarion-Document-table" style="width:100%;max-width:1280px;margin-left:0px;margin-right:auto;border:1px
    solid #CCCCCC;empty-cells:show;border-collapse:collapse;"><tbody><tr><th style="font-weight:bold;background-color:#F0F0F0;text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">Lokaler Bezeichner</th><th style="font-weight:bold;background-color:#F0F0F0;text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">Code [hex]</th><th style="font-weight:bold;background-color:#F0F0F0;text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">Bedeutung</th></tr><tr><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;"><code>DESC_DTC_Seatcontact_ScUb</code></td><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">0x0139</td><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">Sitzkontaktschalter Kurzschluss nach 12V</td></tr><tr><td
    style="text-align:left;vertical-align:top;border:1px solid #CCCCCC;padding:5px;"><code>DESC_DTC_Seatcontact_Invalid</code></td><td
    style="text-align:left;vertical-align:top;border:1px solid #CCCCCC;padding:5px;">0x2B07</td><td
    style="text-align:left;vertical-align:top;border:1px solid #CCCCCC;padding:5px;">Sitzkontaktschalter
    defekt</td></tr></tbody></table><p><b>Befund der manuellen Code-Analyse (2026-08-19):</b>
    beide Codes werden im Aufrufer <b>direkt</b> ueber ihr CANdela-Symbol gesetzt
    &mdash; es gibt fuer diese Funktion weder ein lokales Alias noch eine Bit-Nummer
    noch eine DTC-Referenztabelle, wie sie andere Funktionen derselben Datei verwenden.
    Der lokale Bezeichner IST deshalb das Katalog-Symbol.</p></p>'
- id: VPAT-11291
  title: ZZ REG NEW State SeatSwitch.SeatSwitchOn
  type: componentrequirement
  outlineNumber: 15.1-1
  status: draft
  description: '<p><p>Der Fahrer sitzt, der Signaltest ist in Ordnung; der Ausgang
    SeatSwitch_u8 ist 1 — gesetzt durch die EINGEHENDEN Uebergaenge (Zeilen 165 und
    234), nicht durch eine entry-Aktion.</p><table class="polarion-Document-table"
    style="width:100%;max-width:1280px;margin-left:0px;margin-right:auto;border:1px
    solid #CCCCCC;empty-cells:show;border-collapse:collapse;"><tbody><tr><th style="font-weight:bold;background-color:#F0F0F0;text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">Verhalten</th><th style="font-weight:bold;background-color:#F0F0F0;text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">Inhalt</th></tr><tr><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">entry</td><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">im Modell nicht geführt</td></tr><tr><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">do</td><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">im Modell nicht geführt</td></tr><tr><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">exit</td><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">im Modell nicht geführt</td></tr></tbody></table><table
    class="polarion-Document-table" style="width:100%;max-width:1280px;margin-left:0px;margin-right:auto;border:1px
    solid #CCCCCC;empty-cells:show;border-collapse:collapse;"><tbody><tr><th style="font-weight:bold;background-color:#F0F0F0;text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">Richtung</th><th style="font-weight:bold;background-color:#F0F0F0;text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">Gegenzustand</th><th style="font-weight:bold;background-color:#F0F0F0;text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">Waechter</th></tr><tr><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">eingehend</td><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;"><code>SeatSwitchOff</code></td><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;"><code>TSigStateSeatContact_u16 == 0 &amp;&amp; DISeatContact_u8
    == 1</code></td></tr><tr><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">ausgehend</td><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;"><code>SeatSwitchRelease</code></td><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;"><code>DISeatContact_u8 == 0</code></td></tr><tr><td
    style="text-align:left;vertical-align:top;border:1px solid #CCCCCC;padding:5px;">ausgehend</td><td
    style="text-align:left;vertical-align:top;border:1px solid #CCCCCC;padding:5px;"><code>SeatSwitchOff</code></td><td
    style="text-align:left;vertical-align:top;border:1px solid #CCCCCC;padding:5px;"><code>DISeatContact_u8
    != 0 &amp;&amp; TSigStateSeatContact_u16 != 0</code></td></tr><tr><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;">eingehend</td><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;"><code>SeatSwitchRelease</code></td><td style="text-align:left;vertical-align:top;border:1px
    solid #CCCCCC;padding:5px;"><code>TSigStateSeatContact_u16 == 0 &amp;&amp; DISeatContact_u8
    == 1</code></td></tr></tbody></table></p>'
- id: VPAT-11292
  title: ZZ REG NEW State SeatSwitch.SeatSwitchOff
  type: componentrequirement
  outlineNumber: 15.2-1
  status: draft
  description: '<p><p>Startzustand. Der Sitz ist nicht besetzt oder die Funktion hat
    einen Fehler erkannt; der Ausgang SeatSwitch_u8 ist 0.</p><table class="polarion-Document-table"
    style="width:100%;max-width:1280px;margin-left:0px;margin-right:auto;border:1px
